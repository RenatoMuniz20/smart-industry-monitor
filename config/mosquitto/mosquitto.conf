# Smart Industry Monitor
# Configuração do broker MQTT para desenvolvimento local

# Porta e endereço de escuta
listener 1883 127.0.0.1

# Permite conexões sem autenticação
allow_anonymous true

# Desativa persistência de mensagens nesta etapa
persistence false

# Exibe os logs no terminal
log_dest stdout

# Registra eventos do broker
log_type all